[package]
name = "Pico_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
panic-halt = "1.0.0"
cortex-m = "0.7.7"
embassy-rp = { version = "0.3", features = ["rp2350", "time-driver"] }
embassy-usb = { version = "0.3" }
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.4" }
usbd-hid = "0.8"

