[package]
name = "Pico_controller"
version = "0.1.0"
edition = "2021"

[dependencies]
panic-halt = "0.2.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
rp235x-hal = { version = "0.4.0", features = ["rt"] }
usbd-hid = "0.10.0"
embedded-hal = "1.0.0"
usb-device = "0.3.2"
heapless = "0.8.0"
fugit = "0.3.6"